[project]
name = "kk2-oracle"
version = "0.1.0"
description = "FastAPI SmolLLM interface"
license = " GPL-2.0-only"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "fastapi>=0.139.0",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.2",
    "python-multipart",
    "torch>=2.12.1",
    "transformers>=5.13.0",
    "uvicorn>=0.50.2",
]

[project.scripts]
listen = "app.main:listen"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
